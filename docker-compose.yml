version: "3.8"

services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_erp_db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: school_erp
      MYSQL_USER: erp_user
      MYSQL_PASSWORD: erp_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: erp_nextjs_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "mysql://erp_user:erp_password@mysql_db:3306/school_erp"
      JWT_SECRET: "replace_with_a_secure_32_character_long_secret_in_production_env"
      NODE_ENV: "production"
    depends_on:
      - mysql_db

volumes:
  mysql_data:
